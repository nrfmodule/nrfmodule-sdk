description: |
  nRF91 modem GNSS exposed through the serial-modem AT bridge (AT#XGNSS).
  Bus-less: the driver is a client of the existing modem AT link and owns
  no peripheral; the node only anchors the driver instance and the `gnss`
  nodelabel.

  The modem AT link must be up before the application powers the GNSS
  session (PM_DEVICE_ACTION_TURN_ON); the driver sends no AT traffic at
  init. API and PM calls block on an AT round-trip.

  Example:

    gnss: gnss-nrf91 {
        compatible = "nrfmodule,gnss-nrf91-slm";
        status = "okay";
    };

compatible: "nrfmodule,gnss-nrf91-slm"

include: base.yaml
